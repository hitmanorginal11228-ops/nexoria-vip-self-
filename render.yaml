services:
  # ------------------------------------------------------------------
  # سرویس تکی به‌صورت Web Service: هم بات و هم هلپر با هم از طریق
  # app.py روشن می‌شن، و یک وب‌سرور کوچیک هم برای health check Render
  # روی پورت PORT بالا میاد (خودکار توسط app.py مدیریت می‌شه).
  # با این تنظیم می‌تونید حتی از پلن Free رندر هم استفاده کنید
  # (با این تفاوت که بعد از مدتی بی‌فعالیتِ HTTP می‌خوابه و باید با
  # UptimeRobot یا مشابه هر چند دقیقه یک‌بار پینگش کنید تا بیدار بمونه).
  # ------------------------------------------------------------------
  - type: web
    name: selfsaz-app
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: FORCE_CHANNELS
        sync: false
      - key: TAX_PERCENT
        value: "10"
      - key: TAX_MIN_AMOUNT
        value: "2"
      - key: COIN_RATE
        value: "1440"
      - key: COIN_PRICE_TOMAN
        value: "50000"
      - key: CARD_NUMBER
        sync: false
      - key: CARD_OWNER
        sync: false
      - key: BANK_NAME
        sync: false
      - key: HELPER_BOT_TOKEN
        sync: false
      - key: PANEL_IMAGE
        value: "link"
      - key: MANAGER_BOT_LINK
        sync: false

  # ------------------------------------------------------------------
  # گزینه‌ی جایگزین: دو سرویس Background Worker جدا (نیاز به پلن پولی
  # Starter داره، پلن Free ازش پشتیبانی نمی‌کنه). اگه از selfsaz-app
  # بالا استفاده می‌کنید، این بخش رو کامنت نگه دارید.
  # ------------------------------------------------------------------
  # ربات مدیریت / فروش (bot.py)
  - type: worker
    name: selfsaz-bot
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python bot.py"
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: FORCE_CHANNELS
        sync: false
      - key: TAX_PERCENT
        value: "10"
      - key: TAX_MIN_AMOUNT
        value: "2"
      - key: COIN_RATE
        value: "1440"
      - key: COIN_PRICE_TOMAN
        value: "50000"
      - key: CARD_NUMBER
        sync: false
      - key: CARD_OWNER
        sync: false
      - key: BANK_NAME
        sync: false

  # ربات هلپر (helper.py)
  - type: worker
    name: selfsaz-helper
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python helper.py"
    envVars:
      - key: HELPER_BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: PANEL_IMAGE
        value: "link"
      - key: MANAGER_BOT_LINK
        sync: false
